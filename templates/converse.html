<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation with Translation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-top: 50px;
        }
        .container {
            margin-top: 20px;
            max-width: 600px;
            margin: 20px auto;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
        }
        textarea {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            width: 100%;
            height: 150px;
            margin-top: 10px;
        }
        .translation-box {
            margin-top: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Conversation with Translation</h1>
    <div class="container">
        <div>
            <label for="user1-language">Select User 1 Language:</label>
            <select id="user1-language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
                <option value="kn">Kannada</option>
                <!-- Add more language options -->
            </select>
        </div>
        <div>
            <label for="user2-language">Select User 2 Language:</label>
            <select id="user2-language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
                <option value="kn">Kannada</option>
                <!-- Add more language options -->
            </select>
        </div>
        <textarea id="user1-input" placeholder="User 1's message"></textarea>
        <textarea id="user2-input" placeholder="User 2's message" readonly></textarea>
        <button onclick="translateConversation()">Translate</button>
        <div class="translation-box" id="translation-box"></div>
    </div>
    <form id="converse_form">
        <label for="user1_text">User 1 Text:</label>
        <input type="text" id="user1_text" name="user1_text">
        <br>
        <label for="user2_text">User 2 Text:</label>
        <input type="text" id="user2_text" name="user2_text">
        <br>
        <button type="submit">Converse</button>
    </form>
    
    <script>
        async function translateText(text, sourceLang, targetLang) {
            const response = await fetch('/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text, sourceLang, targetLang })
            });
            const data = await response.json();
            return data.translated_text;
        }

        async function translateConversation() {
            const user1Input = document.getElementById('user1-input').value;
            const user1Lang = document.getElementById('user1-language').value;
            const user2Lang = document.getElementById('user2-language').value;

            const user2Input = await translateText(user1Input, user1Lang, user2Lang);
            document.getElementById('user2-input').value = user2Input;

            const translationBox = document.getElementById('translation-box');
            translationBox.innerHTML = `<p>User 1 (${user1Lang}): ${user1Input}</p><p>User 2 (${user2Lang}): ${user2Input}</p>`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('converse_form');
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                const formData = new FormData(form);
                const response = await fetch('http://127.0.0.1:50153/converse', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                console.log(data); // Handle as needed
            });
        });
    </script>
</body>
</html>
